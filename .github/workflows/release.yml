# Publishes to crates.io when a v* tag is pushed, through Trusted Publishing:
# crates.io exchanges GitHub's short-lived OIDC token for a temporary registry
# token, so no CARGO_REGISTRY_TOKEN secret exists to store, leak or rotate.
#
# One-time setup on crates.io (crate → Settings → Trusted Publishing):
#   Repository owner: autor3search   Repository name: rust
#   Workflow filename: release.yml    Environment: (leave blank)
# The crate must already exist, so the FIRST publish of a new crate name has to
# be done once from a developer machine with `cargo publish`.
#
# To release: bump `version` in Cargo.toml, commit, then
#   git tag v<version> && git push origin v<version>
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # The only permission Trusted Publishing needs: mint an OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A tag that disagrees with Cargo.toml publishes a version nobody can
      # check out, and crates.io releases are immutable. Fail before uploading.
      - name: the tag must be the version it claims to be
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "publishing $version"

      # The same gates ci.yml runs. A release is not the place to find out that
      # the tagged commit does not pass them.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
